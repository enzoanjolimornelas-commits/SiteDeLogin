<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container-login">
        <div id="login">
            <img src="imagens/person_40dp_E3E3E3_FILL0_wght400_GRAD0_opsz40.png" alt="Figura de uma pessoa" id="person">
            <label>Email</label>
            <input type="email" id="email" name="email" placeholder="Digite o seu email...">
            <label>Senha</label>
            <input type="password" id="password" name="password" placeholder="Digite a sua senha...">
            <button id="confirmation">Login</button>
        </div>
    </div>
</body>
</html>
